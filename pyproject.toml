[project]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
name = "dehal"
version = "2.1.2"
description = "DEHAL - DEtecting HALlucinations: deterministic evidence-first verification engine for AI/agent claims"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["dehal*", "bodulskihal_core*"]
exclude = ["grants*", "tests*", "examples*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
