[project]
name = "bodulskihal-core"
version = "2.1.2"
description = "Deterministic evidence-first verification engine for AI/agent claims"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["bodulskihal_core*"]
exclude = ["grants*", "tests*", "examples*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
