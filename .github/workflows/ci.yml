name: BodulskiHal Core CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BODULSKIHAL_SOURCE_COMMIT: ${{ github.sha }}
  BODULSKIHAL_SOURCE_REF: ${{ github.ref }}
  BODULSKIHAL_BUILD_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile
        run: python -m compileall -q bodulskihal_core

      - name: Test
        run: python -m pytest

      - name: Grouped architecture experiment
        run: |
          python -m pytest -q experiments/grouped_n1n2_c_s1_s2/test_runner.py experiments/grouped_n1n2_c_s1_s2/test_fuzz.py
          python -m compileall -q experiments/grouped_n1n2_c_s1_s2

      - name: Combined core + grouped regression
        run: python -m pytest -q tests experiments/grouped_n1n2_c_s1_s2/test_runner.py experiments/grouped_n1n2_c_s1_s2/test_fuzz.py

      - name: Runtime provenance gate
        run: |
          python - <<'PY'
          from bodulskihal_core import current_runtime_provenance
          p = current_runtime_provenance()
          print(p)
          assert p.verified, p
          PY

      - name: Demo smoke
        run: python examples/demo.py

      - name: Research demo smoke
        run: python examples/research_demo.py

      - name: Evaluation harness smoke
        run: python examples/evaluation_demo.py
